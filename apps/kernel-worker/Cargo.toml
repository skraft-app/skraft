[package]
name = "solidsketch-kernel-worker"
description = "SolidSketch: the kernel in a web worker — runs the jobs the web UI posts (ARCHITECTURE.md §7 ter)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
solidsketch-kernel = { workspace = true, features = ["engine"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["DedicatedWorkerGlobalScope", "console"] }
