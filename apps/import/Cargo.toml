[package]
name = "skraft-import"
description = "Skraft: converts a SketchUp (.skp) or STEP file to a .skraft file, as the app imports it"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "skraft-import"
path = "src/main.rs"

[dependencies]
glam.workspace = true
skraft-model.workspace = true
skraft-kernel = { workspace = true, features = ["engine"] }
