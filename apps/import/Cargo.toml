[package]
name = "skraft-import"
description = "Skraft: converts a SketchUp export (scripts/sketchup/export.rb) to a .skraft file"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "skraft-import"
path = "src/main.rs"

[dependencies]
glam.workspace = true
skraft-model.workspace = true
skraft-kernel = { workspace = true, features = ["engine"] }
