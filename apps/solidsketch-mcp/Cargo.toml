[package]
name = "solidsketch-mcp"
description = "SolidSketch: an MCP server (stdio) over the control protocol — the running app, or an editor of its own without a window (docs/ARCHITECTURE.md §7 septies)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "solidsketch-mcp"
path = "src/main.rs"

[dependencies]
solidsketch-control = { workspace = true, features = ["engine"] }
solidsketch-model = { workspace = true, features = ["engine"] }
solidsketch-kernel = { workspace = true, features = ["engine"] }
solidsketch-tools.workspace = true
glam.workspace = true
serde_json.workspace = true
