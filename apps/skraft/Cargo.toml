[package]
name = "skraft"
description = "Skraft: a 3D CAD prototype modelling with exact solids, groups and components (native and web)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "skraft"
path = "src/main.rs"

[lib]
# The web build (wasm-pack) uses the library; the desktop build the binary.
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
skraft-i18n.workspace = true
skraft-model.workspace = true
skraft-render.workspace = true
skraft-tools.workspace = true
skraft-theme.workspace = true
glam.workspace = true
egui.workspace = true
eframe.workspace = true
egui-wgpu.workspace = true
egui_extras.workspace = true
image.workspace = true
# The app's cursors, SVG rasterised (src/kit/cursors.rs); egui_extras' own, for its SVG icons.
resvg = { version = "0.45", default-features = false }
wgpu.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
# The control protocol (docs/control-protocol.md): its methods, the editor's answers.
skraft-control.workspace = true
# A clock on the web too (the render statistics overlay); already eframe's.
web-time = "1.1"
# Screenshots of the control protocol (src/system/driving.rs), on the web too.
png = "0.18"
# A drawing written as a PDF, its texts in the app's font (src/drawing/pdf.rs).
krilla.workspace = true
# The system's preferred languages, for the texts when the preferences leave the language to
# it (src/system/language.rs).
sys-locale = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The kernel runs on a thread of the app; on the web, in its own worker (docs/model/kernel.md).
skraft-kernel = { workspace = true, features = ["engine"] }
# The control protocol and its server (docs/control-protocol.md); volumes by the kernel.
skraft-control = { workspace = true, features = ["engine"] }
rfd.workspace = true
# Runs the asynchronous file dialogs on a thread (src/system/file.rs).
pollster.workspace = true
env_logger = "0.11"
dirs = "7"
# The check for a new version (src/dialogs/update.rs): HTTPS with the system's certificates.
ureq = { version = "3.5", default-features = false, features = ["rustls-no-provider"] }
rustls-native-certs = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(target_os = "linux")'.dependencies]
# winit's windowing backends, off with eframe's default features (workspace Cargo.toml).
eframe = { workspace = true, features = ["wayland", "x11"] }
# The system's decimal separator (src/system/separators.rs): its numeric locale.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# The system's decimal and list separators (src/system/separators.rs).
windows-sys = { version = "0.61", features = ["Win32_Globalization"] }

[target.'cfg(windows)'.build-dependencies]
# The executable's icon and version in the Explorer (build.rs).
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
# The native menu bar (src/window/native_menu.rs): the same commands as the ☰ menu elsewhere.
muda = { version = "0.21", default-features = false }
# The documents the system asks to open (src/system/opened.rs): an Apple Event handler.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSLocale", "NSNotification", "NSString", "NSURL"] }
# The window's title bar is the app's (src/lib.rs, `app_drags_window`): AppKit's own drag in it is
# turned off.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSView", "NSWindow"] }
raw-window-handle = "0.6"

[target.'cfg(target_arch = "wasm32")'.dependencies]
rfd.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url", "Storage", "Location", "Worker", "WorkerOptions", "WorkerType", "MessageEvent", "ErrorEvent", "BeforeUnloadEvent", "Event", "Node", "HtmlHeadElement"] }
js-sys = "0.3"
console_error_panic_hook = "0.1"
# The browser's languages (`navigator.languages`).
sys-locale = { version = "0.3", features = ["js"] }
