[package]
name = "solidsketch"
description = "SolidSketch: a 3D CAD prototype modelling with exact solids, groups and components (native and web)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "solidsketch"
path = "src/main.rs"

[lib]
# The web build (wasm-pack) uses the library; the desktop build the binary.
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
solidsketch-i18n.workspace = true
solidsketch-model.workspace = true
solidsketch-render.workspace = true
solidsketch-tools.workspace = true
solidsketch-theme.workspace = true
glam.workspace = true
egui.workspace = true
eframe.workspace = true
egui-wgpu.workspace = true
egui_extras.workspace = true
wgpu.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
# A clock on the web too (the render statistics overlay); already eframe's.
web-time = "1.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The kernel runs on a thread of the app; on the web, in its own worker (ARCHITECTURE.md §7 ter).
solidsketch-kernel = { workspace = true, features = ["engine"] }
rfd.workspace = true
env_logger = "0.11"
dirs = "6"
# Screenshots of the control channel (src/control.rs).
png = "0.17"

[target.'cfg(target_os = "macos")'.dependencies]
# The native menu bar (src/native_menu.rs): the same commands as the ☰ menu elsewhere.
muda = { version = "0.21", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rfd.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url", "Storage", "Location", "Worker", "WorkerOptions", "WorkerType", "MessageEvent", "ErrorEvent"] }
js-sys = "0.3"
console_error_panic_hook = "0.1"
