# Skraft's texts in English (US). The reference is `fr.yml`, whose comments say where each text
# shows (docs/ui/texts.md): this catalog has exactly its keys and placeholders, which the
# skraft-i18n tests check. Menu items, commands, tool names, buttons and option labels are in
# title case; hints, tips and messages in sentence case. No text holds an ellipsis (…): the
# code adds it.

