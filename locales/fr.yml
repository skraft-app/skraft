    undo_op: "$t(common.undo) %{op}"
    redo: "$t(common.redo)"
    redo_op: "$t(common.redo) %{op}"
    erase: "$t(common.erase)"
    make_assembly: "$t(common.make_assembly)"
    explode: "$t(common.explode)"
    make_unique: "$t(common.make_unique)"
    delete_guides: "Supprimer les guides"
    select_all: "Tout sélectionner"
    command_palette: "$t(common.command_palette)"
    preferences: "$t(common.preferences)"
  view:
    title: "Vue"
    parallel: "Projection parallèle"
    grid: "$t(common.grid)"
    axes: "$t(common.axes)"
    guides: "$t(common.guides)"
    silhouettes: "$t(common.silhouettes)"
    section: "Afficher la coupe"
    section_clear: "Supprimer la coupe"
    materials: "Panneau $t(common.materials)"
    top: "Dessus"
    front: "Face"
    right: "Droite"
    back: "Arrière"
    left: "Gauche"
    iso: "Iso"
    zoom_extents: "Zoom étendu"
  tools:
    title: "Outils"
  solids:
    title: "Solides"
  # Only with `?debug` (web) or SOLIDSKETCH_DEBUG (desktop).
