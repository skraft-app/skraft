# The names new components get (then the user's to change).
default_name:
  model: "$t(common.model)"
  assembly: "$t(common.assembly)"
  # Every part a drawing tool makes, whatever its shape.
  part: "$t(common.part)"
  material: "$t(common.material) %{number}"
  # A file name proposed when saving, without its extension.
  file: "modele"

error:
  # A typed value that cannot be read (the measurements box, the entity info).
  expr:
    syntax: "« %{text} » incompris"
    missing_operand: "opérande manquant"
    missing_close_parenthesis: "parenthèse fermante manquante"
