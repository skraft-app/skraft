    grid: "$t(common.grid)"
    axes: "$t(common.axes)"
    guides: "$t(common.guides)"
    silhouettes: "$t(common.silhouettes)"
    # Every part see-through, its edges all seen, and points behind faces inferred on (for
    # the session).
    xray: "Rayon X"
    hide_rest_of_model: "$t(common.hide_rest_of_model)"
    # Draws what the user hid, faded (and lets it be picked).
    show_hidden: "Voir les éléments masqués"
    show_all: "$t(common.show_all)"
    section: "Afficher la coupe"
    section_clear: "Supprimer la coupe"
    entity_info: "Panneau $t(panel.entity_info.title)"
    materials: "Panneau $t(common.materials)"
    outliner: "Panneau $t(panel.outliner.title)"
    render_stats: "Statistiques de rendu"
