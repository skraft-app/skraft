infer:
  endpoint: "Extrémité"
  midpoint: "Milieu"
  center: "Centre"
  origin: "Origine"
  on_edge: "Sur l'arête"
  on_face: "Sur la face"
  edge: "Arête"
  # A guide circle inside a crossing: « Guide × axe rouge ».
  guide: "Guide"
  on_guide: "Sur le guide"
  axis:
    red: "rouge"
    green: "vert"
    blue: "bleu"
  # A line inside a crossing: « axe rouge × parallèle ».
  line:
    axis: "axe %{axis}"
    tracked_axis: "axe %{axis} depuis le point"
    parallel: "parallèle"
    perpendicular: "perpendiculaire"
    tangent: "tangente"
    radial: "rayon"
    guide: "guide"
