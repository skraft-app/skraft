# SolidSketch's texts in French: the reference catalog (docs/ARCHITECTURE.md §6 quater).
#
# A key is a path that follows where the text shows in the app. `%{name}` is a value the
# code fills in; a key ending in `_plural` is the plural of the same key without it (for a
# count, `%{count}`). Every other locale has exactly the same keys and placeholders: the
# solidsketch-i18n tests check it, and that the code uses every key. `$t(key)` takes another
# text in (see `common`). No text holds an ellipsis (…): the code adds it, the same for every
# language.

_version: 1

locale:
  # The language's name in itself, in the language menu.
  name: "Français"
  decimal_separator: ","

# Generic terms, written once: other texts take them in with `$t(common.undo)` (any key can
# be taken in this way). Named by meaning, not by the French word: « Annuler » is `undo` here,
# and would be another key as a dialog's Cancel. A text taken in is used as is: no change of
# case, so a term inside a sentence is written in the sentence.
common:
  undo: "Annuler"
  redo: "Rétablir"
  erase: "Effacer"
  copy: "Copier"
  copies: "Copies"
  move: "Déplacer"
  rotate: "Faire pivoter"
  paint: "Peindre"
  make_assembly: "Créer un assemblage"
  explode: "Éclater"
  make_unique: "Faire une pièce à part"
  preferences: "Préférences"
  command_palette: "Palette de commandes"
  grid: "Grille"
  axes: "Axes"
  guides: "Guides"
  silhouettes: "Silhouettes"
  hide_rest_of_model: "Masquer le reste du modèle"
  hide: "Masquer"
  show: "Afficher"
  show_all: "Tout afficher"
  dimensions: "Dimensions"
  height: "Hauteur"
  speed: "Vitesse"
  model: "Modèle"
  part: "Pièce"
  assembly: "Assemblage"
  material: "Matière"
  materials: "Matières"

# Key names, in hints and shortcuts.
key:
  option: "Option"
  ctrl: "Ctrl"
  shift: "Maj"
  # Off macOS (macOS shows ⌥).
  alt: "Alt"
  command: "Cmd"
  space: "Espace"
  delete: "Suppr"

window:
  # The title of a document never saved.
  untitled: "Sans titre"

menu:
  # The macOS app menu, titled with the app's name (%{app}).
  app:
    about: "À propos de %{app}"
    services: "Services"
    hide: "Masquer %{app}"
    hide_others: "Masquer les autres"
    show_all: "Tout afficher"
    quit: "Quitter %{app}"
  # The macOS Window menu.
  window:
    title: "Fenêtre"
    minimize: "Placer dans le Dock"
    zoom: "Zoom"
    fullscreen: "Passer en mode plein écran"
    bring_all_to_front: "Tout ramener au premier plan"
  file:
    title: "Fichier"
    new: "Nouveau"
    open: "Ouvrir"
    # Places a STEP file's content in the model.
    import: "Importer"
    save: "Enregistrer"
    save_as: "Enregistrer sous"
    # One of the last files opened or saved (%{n}: 1 to 4), as the command palette and the
    # shortcut preferences name it; the menu shows the file's name.
    recent: "Fichier récent %{n}"
    # Closes the shown document's tab.
    close: "Fermer l'onglet"
    # Off macOS (there it is the app menu's « Quitter SolidSketch »).
    quit: "Quitter"
  edit:
    title: "Édition"
    undo: "$t(common.undo)"
    undo_op: "$t(common.undo) %{op}"
    redo: "$t(common.redo)"
