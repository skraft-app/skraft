    paste: "Coller"
    paste_in_place: "Coller sur place"
    erase: "$t(common.erase)"
    make_assembly: "$t(common.make_assembly)"
    explode: "$t(common.explode)"
    make_unique: "$t(common.make_unique)"
    delete_guides: "Supprimer les guides"
    select_all: "Tout sélectionner"
    command_palette: "$t(common.command_palette)"
    preferences: "$t(common.preferences)"
