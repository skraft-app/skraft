# SolidSketch's texts in French: the reference catalog (docs/ARCHITECTURE.md §6 quater).
#
# A key is a path that follows where the text shows in the app. `%{name}` is a value the
# code fills in; a key ending in `_plural` is the plural of the same key without it (for a
# count, `%{count}`). Every other locale has exactly the same keys and placeholders: the
# solidsketch-i18n tests check it, and that the code uses every key. `$t(key)` takes another
# text in (see `common`). No text holds an ellipsis (…): the code adds it, the same for every
# language.

_version: 1

locale:
  # The language's name in itself, in the language menu.
  name: "Français"
  decimal_separator: ","

# Generic terms, written once: other texts take them in with `$t(common.undo)` (any key can
# be taken in this way). Named by meaning, not by the French word: « Annuler » is `undo` here,
# and would be another key as a dialog's Cancel. A text taken in is used as is: no change of
# case, so a term inside a sentence is written in the sentence.
common:
  undo: "Annuler"
  redo: "Rétablir"
  erase: "Effacer"
  copy: "Copier"
  copies: "Copies"
  move: "Déplacer"
  rotate: "Faire pivoter"
  paint: "Peindre"
  make_assembly: "Créer un assemblage"
  explode: "Éclater"
  make_unique: "Faire une pièce à part"
  preferences: "Préférences"
  command_palette: "Palette de commandes"
  grid: "Grille"
  axes: "Axes"
  guides: "Guides"
  silhouettes: "Silhouettes"
  dimensions: "Dimensions"
  height: "Hauteur"
  speed: "Vitesse"
  model: "Modèle"
  part: "Pièce"
  assembly: "Assemblage"
  material: "Matière"
  materials: "Matières"
  machinings: "Usinages"

# Key names, in hints and shortcuts.
key:
