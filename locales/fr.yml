  boolean_hint: "cible, puis outil"
  perspective: "Perspective / parallèle"

# The title bar: the document, the view's toggles, the command search.
titlebar:
  modified: "Modifié depuis le dernier enregistrement"
  # The ☰ button (web, Windows, Linux: macOS has its menu bar).
