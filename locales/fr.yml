    not_a_length: "le résultat n'est pas une longueur"
    not_an_angle: "le résultat n'est pas un angle"
    unknown_variable: "@%{name} inconnu"
    no_matching_value: "%{function} : aucune valeur ne convient"
    argument_count: "%{function} : au moins deux valeurs"
    comma_separator: "%{function} : séparer les valeurs par « ; »"
    too_many: "%{count} valeur au plus"
    too_many_plural: "%{count} valeurs au plus"
  # An operation refused by the document.
  model:
    not_found: "%{id} introuvable"
    not_a_part: "%{id} n'est pas une pièce"
    not_an_assembly: "%{id} n'est pas un assemblage"
    cycle: "un assemblage se contiendrait lui-même"
    out_of_step: "les résultats du noyau ne correspondent pas à l'opération"
    placement_not_rigid: "un placement est un déplacement et une rotation"
