# The status bar: the measurements box, and the messages of the app and of the editor.
status:
  measurements: "Mesures"
  saved: "Enregistré"
  save_failed: "Enregistrement impossible : %{error}"
  open_failed: "%{file} : %{error}"
  prefs_not_saved: "Préférences non enregistrées : %{error}"
  control_failed: "Canal de pilotage : %{error}"
  command_unknown: "commande inconnue « %{id} »"
  command_unavailable: "« %{id} » n'est pas disponible maintenant"
  # « calcul en cours… (Échap pour abandonner) »: the code joins them with the ellipsis.
  computing: "%{op} : calcul en cours"
  computing_cancel: "(Échap pour abandonner)"
  busy: "Un calcul est déjà en cours"
  op_failed: "%{op} : %{error}"
  abandoned: "%{op} : abandonné"
  display_failed: "Affichage impossible : %{error}"
  unexpected_reply: "réponse inattendue du noyau"
  nothing_to_group: "Sélectionner d'abord ce qu'il faut regrouper"
  no_guides: "Aucun guide ici"
  # Typing a count after a copy, when the copy was undone or replaced since.
  copy_not_last: "Le dernier pas n'est plus cette copie"
  # In the view, when the GPU cannot draw.
  no_wgpu: "wgpu indisponible"
  debug:
    crash_asked: "Plantage du noyau demandé"
    crash_message: "plantage voulu (menu Débogage)"
    crashed: "Plantage provoqué : %{error}"
    not_crashed: "Plantage provoqué : le noyau n'a pas planté"
    next_done: "la tâche suivante a abouti"
    next_failed: "la tâche suivante a échoué : %{error}"

# The tools: their name (option bar, menus), the status bar hints at each step, the
# measurements box's label, their options and what they say when they refuse.
tool:
  # Added to a hint while the tool copies.
  copying: "(copie)"
  select:
    name: "Sélection"
    hint:
      idle: "Cliquer pour sélectionner · Glisser : rectangle (→ contenu, ← touché) · Maj : ajouter/retirer · Double-clic : entrer dans un assemblage ou ouvrir une pièce, ou en sortir"
      crossing: "Capture : sélectionne ce que le rectangle touche · Maj : ajouter/retirer"
      window: "Fenêtre : sélectionne ce que le rectangle contient entièrement · Maj : ajouter/retirer"
  # What the box and the cylinder share.
  shape:
    hint:
      height: "Cliquer la hauteur, ou la taper · Maj : la dernière hauteur · double-clic : la dernière hauteur · %{copy_key} maintenu : jusqu'à la face, appui bref : hauteur centrée"
    vcb:
      distances: "Distances"
    option:
      pull_centered: "Hauteur centrée"
      pull_centered_tip: "La hauteur s'étend autant de part et d'autre du plan (%{copy_key} pendant la hauteur : basculer)"
      from_corner: "Depuis un coin"
      from_corner_tip: "Le premier point se mesure depuis le coin le plus proche : taper les distances (%{alt_key} : basculer)"
  box:
    name: "Boîte"
    hint:
      first: "Cliquer le premier coin de la base · flèches : plan rouge, vert, bleu · ↓ : plan de la face · %{copy_key} maintenu : centre de la face, + Maj : face entière · %{alt_key} : depuis un coin"
      base: "Cliquer le coin opposé, ou taper longueur;largeur (;hauteur) · flèches : bloquer le plan · %{copy_key} : centré · Échap : revenir"
    vcb:
      dimensions: "$t(common.dimensions)"
      height: "$t(common.height)"
    say:
      empty: "Boîte vide : une dimension est nulle"
      empty_base: "Base vide : choisir un coin opposé"
      base_lengths: "Base vide : deux longueurs sont nécessaires"
    option:
      centered: "Centré"
      centered_tip: "Le premier clic est le centre de la base (%{copy_key} : basculer)"
  cylinder:
    name: "Cylindre"
    hint:
      center: "Cliquer le centre de la base · flèches : plan rouge, vert, bleu · ↓ : plan de la face · %{copy_key} maintenu : centre de la face, + Maj : disque entier · %{alt_key} : depuis un coin"
      radius: "Cliquer le rayon, ou taper rayon (;hauteur) · Tab : mesurer le diamètre"
      diameter: "Cliquer le bord, ou taper diamètre (;hauteur) · Tab : mesurer le rayon"
    vcb:
      radius: "Rayon"
      diameter: "Diamètre"
      height: "$t(common.height)"
    say:
      empty: "Cylindre vide : une dimension est nulle"
      zero_radius: "Rayon nul"
    option:
      measure: "Mesure"
      measure_tip: "La longueur affichée et tapée pour la base (Tab pour changer)"
      radius: "Rayon"
      radius_tip: "Du centre au bord"
      diameter: "Diamètre"
      diameter_tip: "D'un bord à l'autre, par le centre"
  move:
    name: "$t(common.move)"
    hint:
      array: "Taper 5x pour un réseau de 5 copies, ou /5 pour 5 copies sur la distance"
      start: "Cliquer le point de départ · flèches : bloquer un axe · %{copy_key} : copier"
      destination: "Cliquer la destination, ou taper une distance · Maj : bloquer l'inférence"
    vcb:
      distance: "Distance"
      copies: "$t(common.copies)"
    option:
      copy: "$t(common.copy)"
      copy_tip: "Copier au lieu de déplacer (%{copy_key} : basculer)"
    say:
      nothing: "Rien à déplacer : sélectionner d'abord"
  rotate:
    name: "$t(common.rotate)"
    hint:
      array: "Taper 6x pour un réseau de 6 copies, ou /6 pour 6 copies sur l'angle"
      center: "Cliquer le centre de rotation · flèches : axe rouge, vert, bleu · %{copy_key} : copier"
      reference: "Cliquer l'origine de l'angle"
      angle: "Cliquer l'angle (pas de 15°), ou le taper en degrés"
    vcb:
      copies: "$t(common.copies)"
      angle: "Angle"
    option:
      copy: "$t(common.copy)"
      copy_tip: "Copier au lieu de faire pivoter (%{copy_key} : basculer)"
    say:
      nothing: "Rien à faire pivoter : sélectionner d'abord"
      too_close: "Cliquer à distance du centre pour l'origine de l'angle"
  boolean:
    union:
      name: "Union"
      verb: "unir"
    difference:
      name: "Soustraire"
      verb: "soustraire"
    intersection:
      name: "Intersecter"
      verb: "intersecter"
    hint:
      target: "Cliquer la pièce à modifier (%{verb}) · Tab : changer la portée"
      tool: "Cliquer la pièce outil (elle sera consommée) pour %{verb} · Tab : changer la portée"
    option:
      scope: "Portée"
      scope_tip: "Ce que l'opération modifie (Tab pour changer)"
      all: "Tous les exemplaires"
      all_count: "Tous les exemplaires ×%{count}"
      all_one: "Tous les exemplaires (un seul)"
      all_tip: "La pièce elle-même : tous ses exemplaires changent"
      this: "Celui-ci"
      this_tip: "Seulement l'exemplaire cliqué : il devient une pièce à part (et son assemblage, s'il est copié)"
  paint:
    name: "$t(common.paint)"
    hint: "Cliquer pour peindre avec la matière choisie (panneau Matières ; aucune : dépeindre) · Tab : l'exemplaire / la face"
    outside: "Hors de l'élément en cours d'édition"
    option:
      target: "$t(common.paint)"
      target_tip: "Ce qu'un clic peint (Tab pour changer)"
      occurrence: "L'exemplaire"
      occurrence_tip: "L'exemplaire cliqué, ou toute la sélection s'il en fait partie"
      face: "La face"
      face_tip: "La face cliquée, sur tous les exemplaires de sa pièce"
  section:
    name: "Plan de coupe"
    hint:
      face: "Cliquer une face : le plan de coupe s'y pose"
      depth: "Déplacer pour enfoncer le plan, ou taper la profondeur ; cliquer pour le poser"
    vcb:
      depth: "Profondeur"
  measure:
    name: "Mètre"
    hint:
      first: "Cliquer un point pour mesurer, ou une arête ou un arc pour tracer un guide parallèle ou concentrique · %{copy_key} : sans guide"
      first_measure_only: "Cliquer un point pour mesurer · %{copy_key} : tracer aussi des guides"
      measure: "Cliquer pour finir la mesure · Échap : recommencer"
      guide: "Cliquer pour poser le guide, ou taper le décalage · Échap : revenir"
    vcb:
      length: "Longueur"
      offset: "Décalage"
    option:
      guides: "Créer des guides"
      guides_tip: "Partir d'une arête ou d'un arc trace un guide parallèle ou concentrique (%{copy_key} pour basculer)"
    say:
      no_offset: "Décalage nul : pas de guide"
      no_radius: "Le cercle n'aurait plus de rayon : pas de guide"
  # The measurements box refusing what was typed.
  vcb:
    refused: "%{label} — « %{text} » : %{error}"
    count_expected: "taper 5x ou /5"

# The inference tooltips (the point under the cursor). Two lines that cross are joined
