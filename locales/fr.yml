    title: "Débogage"
    crash_kernel: "Faire planter le noyau"

# The tool bar's tooltips: a command's label and shortcut, and a hint for some.
toolbar:
  with_shortcut: "%{label} (%{shortcut})"
  with_hint: "%{tip} · %{hint}"
