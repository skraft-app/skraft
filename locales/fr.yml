    bad_guide: "guide %{id} invalide"
    misfiled: "composant %{id} rangé sous %{key}"
    shape_out_of_step: "pièce %{id} : forme sans rapport avec ses usinages"
    duplicate_occurrence: "exemplaire %{occurrence} en double dans %{assembly}"
