# Checks that every dependency's license can ship with Skraft (GPL-3.0-or-later): deny.toml's
# `allow` list, on each push to main or pull request that touches the dependencies or the
# list. The release workflow runs the same check before building.
name: Licenses

on:
  push:
    branches: [main]
    paths: ["**/Cargo.toml", "Cargo.lock", "deny.toml", "about.toml", ".github/workflows/licenses.yml"]
  pull_request:
    paths: ["**/Cargo.toml", "Cargo.lock", "deny.toml", "about.toml", ".github/workflows/licenses.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  licenses:
    name: cargo deny check licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2
        with:
          tool: cargo-deny@0.21.0
      - run: cargo deny --locked check licenses
