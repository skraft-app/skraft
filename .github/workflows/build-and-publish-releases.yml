# Builds the desktop installers and, on a version tag, publishes them as a GitHub Release.
#
# - Push a tag `v<version>` (the workspace version of Cargo.toml): installers + Release.
#     git tag v0.1.0 && git push origin v0.1.0
# - Actions tab → Build and Publish Releases → « Run workflow »
#   (or `gh workflow run build-and-publish-releases.yml`): the installers only, as the run's
#   artifacts; with « release » ticked
#   (`gh workflow run build-and-publish-releases.yml -f release=true`), also the Release
#   v<version>, its tag created on the run's commit (an existing Release of that tag is updated).
#   One box per OS, all ticked by default, picks the builds (`-f windows=false`…); a tag push
#   builds them all.
# - Before building: every dependency's license must be allowed by deny.toml (Skraft is
#   GPL-3.0-or-later); each installer ships LICENSE and THIRD-PARTY-LICENSES.txt (cargo-about).
# - The Release's text is the version's CHANGELOG.md entry (scripts/release-notes.sh, written
#   with `/changelog` in Claude Code): a release without one stops at the Plan job, before the
#   builds.
name: Build and Publish Releases

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: Also publish the GitHub Release v<version> (tag created on this commit)
        type: boolean
        default: false
      macos:
        description: Build macOS (arm64 and x86_64)
        type: boolean
        default: true
      windows:
        description: Build Windows (x86_64)
        type: boolean
        default: true
      linux:
        description: Build Linux (x86_64)
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Both macOS builds run on Big Sur and later (packaging/macos/Info.plist).
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  # The build matrix, keeping the OSes ticked (a manual run) or all of them (a tag push): a
  # matrix can't be filtered by a job condition, and an `exclude` is undone by `include` entries.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.21.0
      - name: Check the dependencies' licenses
        run: cargo deny --locked check licenses
      - name: Check the CHANGELOG.md entry
        if: github.event_name != 'workflow_dispatch' || inputs.release
        run: |
          if ! notes="$(scripts/release-notes.sh)"; then
            echo "::error::CHANGELOG.md has no entry for $(scripts/version.sh): write it (/changelog) before releasing"
            exit 1
          fi
          printf '%s\n' "$notes"
      - id: plan
        env:
          ALL: ${{ github.event_name != 'workflow_dispatch' }}
          MACOS: ${{ inputs.macos }}
          WINDOWS: ${{ inputs.windows }}
          LINUX: ${{ inputs.linux }}
        run: |
          # macos-x86_64: cross-built on the Apple Silicon runner (GitHub's Intel runners are
          # being retired). Linux: the oldest supported Ubuntu, the AppImage needing a glibc at
          # least as old as the systems it runs on.
          all='[
            {"platform": "macos", "name": "macos-arm64", "os": "macos-latest", "target": "aarch64-apple-darwin", "package": "scripts/package-macos.sh"},
            {"platform": "macos", "name": "macos-x86_64", "os": "macos-latest", "target": "x86_64-apple-darwin", "package": "scripts/package-macos.sh"},
            {"platform": "windows", "name": "windows-x86_64", "os": "windows-latest", "target": "x86_64-pc-windows-msvc", "package": "scripts/package-windows.sh"},
            {"platform": "linux", "name": "linux-x86_64", "os": "ubuntu-22.04", "target": "x86_64-unknown-linux-gnu", "package": "scripts/package-linux.sh"}
          ]'
          include="$(jq -c \
            --argjson all "$ALL" \
            --arg macos "$MACOS" --arg windows "$WINDOWS" --arg linux "$LINUX" \
            'map(select($all or ({macos: $macos, windows: $windows, linux: $linux}[.platform] == "true")))' \
            <<<"$all")"
          if [ "$include" = "[]" ]; then
            echo "::error::no OS ticked, nothing to build"
            exit 1
          fi
          echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag against the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(scripts/version.sh)"
          if [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} but Cargo.toml says $version"
            exit 1
          fi

      # rustup installs the toolchain of rust-toolchain.toml on first use.
      - name: Rust toolchain
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev

      - name: WiX
        if: runner.os == 'Windows'
        run: dotnet tool install --global wix --version 5.0.2

      # The third-party notices (scripts/third-party-licenses.sh).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3

      - name: Build
        run: cargo build --release --locked -p skraft --target ${{ matrix.target }}

      - name: Package
        run: ${{ matrix.package }} ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: Skraft-${{ matrix.name }}
          path: dist/release/*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # The tag pushed, else the one a manual run creates.
      - id: version
        run: echo "tag=v$(scripts/version.sh)" >> "$GITHUB_OUTPUT"
      - name: Release notes
        run: scripts/release-notes.sh > "$RUNNER_TEMP/release-notes.md"
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Skraft ${{ steps.version.outputs.tag }}
          files: dist/*
          body_path: ${{ runner.temp }}/release-notes.md
