<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Added to a phone's home screen: the app's own window. No status bar style: iOS 26 blurs a
       page drawn under it, black-translucent or not. The theme colour (set again by the app from
       its theme) tints the bars of the browsers that take it; Safari 26 takes the edges' below
       (docs/ui/touch.md#safe-areas). -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#3a342e">
  <meta name="robots" content="noindex">
  <title>Skraft</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <!-- A phone's home screen: a square picture, the mark on its full orange (the system rounds
       its corners), apps/skraft/assets/app-icon-full.png at iOS's 180 px. -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!-- The last theme's colours (system::web::set_page_colors keeps them), taken before the page
       shows: the loading screen in them, and Safari's bars, which read it first. -->
  <script>
    try {
      const [top, bottom, ink] = (localStorage.getItem("skraft.page_colors") ?? "").split(" ");
      if (ink) {
        const root = document.documentElement.style;
        root.setProperty("--skraft-top", top);
        root.setProperty("--skraft-bottom", bottom);
        root.setProperty("--skraft-ink", ink);
      }
    } catch {}
    // The other browsers on iOS run WebKit too but tint no bar from the edges' strips: they
    // name themselves in the user agent, and go without the strips (see .edge).
    if (/CriOS|FxiOS|EdgiOS|OPiOS|DuckDuckGo|GSA\//.test(navigator.userAgent))
      document.documentElement.classList.add("no-edges");
  </script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    /* Solid grounds (a gradient is no colour to a browser that tints its bars from the page): the
       title bar's colour at the root, the panels' on the body over it. */
    html { background-color: var(--skraft-top, #3a342e); }
    /* A touch screen's gestures are the app's (docs/ui/touch.md): no page scrolled, bounced or
       zoomed, no text selected, callout or highlight on a long press or a tap. eframe listens to
       `touchmove` on the document, passively in Chrome: only `touch-action` keeps the browser
       from panning and zooming the page. */
    html, body { overscroll-behavior: none; -webkit-user-select: none; user-select: none;
                 -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
    /* The app within the screen's safe areas (a phone's notch, status bar, home indicator): the
       page around it in the title bar's colour above, the panels' elsewhere, which the app sets
       from its theme (docs/ui/touch.md#safe-areas). */
    /* Fixed: the page never scrolls, not even by the status bar's height iOS counts in 100vh,
       which left it shifted up after a rotation. */
    body { position: fixed; inset: 0; height: auto; box-sizing: border-box;
           padding: calc(env(safe-area-inset-top) + var(--edge)) env(safe-area-inset-right)
                    calc(env(safe-area-inset-bottom) + var(--edge)) env(safe-area-inset-left);
           background-color: var(--skraft-bottom, #eceef0); }
    /* Safari 26 (and a home-screen app's status bar) takes its bars' colours from fixed elements
       touching the window's top and bottom edges that it sees, read when they appear: these
       strips, the title bar's colour and the panels', in a line the app's canvas leaves free
       above it and below it (the body's padding) — the app takes them out and puts them back when
       its theme changes. Only Safari on iOS and iPadOS reads them: WebKit there (the only one
       that knows -webkit-touch-callout), less the other browsers built on it (.no-edges).
       Elsewhere the strips are nought and the canvas takes the whole height. */
    :root { --edge: 0px; }
    @supports (-webkit-touch-callout: none) { :root:not(.no-edges) { --edge: 11px; } }
    .edge { position: fixed; left: 0; right: 0; height: var(--edge); z-index: 10; pointer-events: none; }
    #edge-top { top: 0; background-color: var(--skraft-top, #3a342e); }
    #edge-bottom { bottom: 0; background-color: var(--skraft-bottom, #fbfaf6); }
    #loader { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 24px;
              align-items: center; justify-content: center; background: var(--skraft-bottom, #fbfaf6); }
    /* The negative margin takes back the empty border of the logo's image. */
    #loader img { width: 72px; height: 72px; margin-bottom: -7px; }
    /* The name in IBM Plex Sans, as outlines: the app's font is in the wasm this waits for. */
    #loader svg { height: 21px; margin: 3px 0; fill: var(--skraft-ink, #111); }
    #loader div { width: 220px; height: 4px; border-radius: 2px; overflow: hidden;
                  background: color-mix(in srgb, var(--skraft-ink, #111) 8%, var(--skraft-bottom, #fbfaf6)); }
    #loader i { display: block; width: 100%; height: 100%; background: #ee7a12;
                transform: scaleX(0); transform-origin: left; transition: transform .15s linear; }
    #loader.failed i { background: #c8352b; transform: scaleX(1); }
    /* The version, and the build's stamp but on a release (scripts/build-web.sh): which page is
       served. */
    #loader small { margin-top: -16px; font: 11px ui-monospace, monospace;
                    color: color-mix(in srgb, var(--skraft-ink, #111) 35%, var(--skraft-bottom, #fbfaf6)); }
    /* The browser's own words for what failed, under the bar: not the app's text (its catalogs
       are in the wasm that failed), a clue to report. */
    #loader p { margin: 0; max-width: 300px; font: 12px ui-monospace, monospace;
                color: color-mix(in srgb, var(--skraft-ink, #111) 55%, var(--skraft-bottom, #fbfaf6));
                text-align: center; overflow-wrap: anywhere; user-select: text; -webkit-user-select: text; }
  </style>
</head>
<body>
  <canvas id="skraft"></canvas>
  <div class="edge" id="edge-top"></div><div class="edge" id="edge-bottom"></div>
  <div id="loader" role="progressbar" aria-label="Skraft" aria-valuemin="0" aria-valuemax="100">
    <img src="favicon.svg" alt=""><svg viewBox="0 0 2761 752" width="77.32" height="21.06" aria-hidden="true"><path d="M260 752Q171 752 107 720Q44 688 0 636L89 550Q124 592 169 614Q214 636 268 636Q329 636 360 609Q391 582 391 538Q391 514 382 497Q374 479 353 467Q332 455 295 449L230 439Q160 428 113 402Q67 376 44 334Q21 292 21 236Q21 173 52 127Q83 81 139 56Q196 30 274 30Q353 30 412 57Q471 83 513 133L423 218Q397 186 360 166Q322 146 266 146Q211 146 182 168Q153 189 153 228Q153 255 163 272Q173 289 195 299Q216 308 250 315L315 327Q386 339 432 365Q478 391 500 432Q522 472 522 530Q522 596 491 646Q461 696 402 724Q343 752 260 752ZM646 740V0H773V340V446H779L848 352L965 218H1109L930 420L1129 740H976L843 506L773 581V740H646ZM1335 740H1208V218H1335V326H1340Q1347 298 1364 274Q1381 249 1409 233Q1438 218 1479 218H1506V339H1466Q1423 339 1394 347Q1365 356 1350 373Q1335 391 1335 420V740ZM2045 740H1974Q1945 740 1923 726Q1900 713 1888 687Q1875 661 1875 626V615L1907 650H1871Q1858 700 1818 726Q1777 752 1719 752Q1639 752 1596 710Q1553 667 1553 598Q1553 544 1579 509Q1606 474 1656 456Q1706 438 1776 438H1865V400Q1865 357 1842 332Q1819 308 1768 308Q1723 308 1695 327Q1667 347 1649 374L1573 306Q1602 261 1650 233Q1698 206 1777 206Q1882 206 1938 254Q1993 303 1993 392V638H2045V740ZM1865 515H1783Q1732 515 1708 531Q1683 548 1683 579V596Q1683 627 1704 643Q1724 659 1761 659Q1791 659 1814 651Q1837 642 1851 625Q1865 608 1865 584V515ZM2175 740V319H2098V218H2175V143Q2175 74 2212 37Q2249 0 2319 0H2410V102H2303V218H2410V319H2303V740H2175ZM2753 740H2662Q2596 740 2562 705Q2527 671 2527 607V319H2450V218H2490Q2519 218 2529 204Q2540 191 2540 164V75H2655V218H2761V319H2655V638H2753V740Z"/></svg><div><i></i></div><small id="build">__BUILD__</small>
  </div>
  <script type="module">
    import init, { skraftCall } from "./pkg/skraft.js";
    import { wheelLines } from "./wheel.js";

    // A mouse wheel's events are re-dispatched in lines, as winit gives them natively, so the
    // viewport zooms; a trackpad's go through (web/wheel.js).
    const canvas = document.getElementById("skraft");
    // A home-screen app on iOS is left scrolled by its status bar's height after a turn to
    // landscape and back: the fixed body shows nothing of it, but the touches' coordinates and
    // the canvas's rect then disagree by as much and every touch lands off. The page is put back
    // at its top (docs/ui/touch.md#safe-areas).
    const unscroll = () => { if (scrollX || scrollY) scrollTo(0, 0); };
    addEventListener("scroll", unscroll);
    addEventListener("resize", unscroll);
    const linesOf = wheelLines(navigator.vendor);
    window.addEventListener("wheel", (e) => {
      if (!e.isTrusted || e.target !== canvas) return;
      const lines = linesOf(e);
      if (!lines) return;
      e.preventDefault();
      e.stopImmediatePropagation();
      canvas.dispatchEvent(new WheelEvent("wheel", {
        deltaX: 0, deltaY: lines, deltaMode: WheelEvent.DOM_DELTA_LINE,
        clientX: e.clientX, clientY: e.clientY, screenX: e.screenX, screenY: e.screenY,
        shiftKey: e.shiftKey, altKey: e.altKey, metaKey: e.metaKey, ctrlKey: e.ctrlKey,
        bubbles: true, cancelable: true,
      }));
    }, { capture: true, passive: false });

    // The control protocol from the page (docs/control-protocol.md): the app's methods,
    // e.g. `await skraft.call("model.geometry", { selection: true })`, a promise of the
    // result (an Uint8Array of PNG for a screenshot), rejected with an Error.
    window.skraft = { call: (method, params) => skraftCall(method, params ?? null) };

    // Safari reads its bars' colours from the edges' strips only as they appear (see .edge): out
    // and back, once the loading screen — which it read first — is gone, and when the app's theme
    // changes (the app calls it).
    window.skraftEdges = () => {
      for (const id of ["edge-top", "edge-bottom"]) {
        const strip = document.getElementById(id);
        if (strip) { strip.remove(); document.body.append(strip); }
      }
    };

    // The loading screen, without text but the app's name drawn: the catalogs are in the wasm
    // it waits for. Progress
    // counts decompressed bytes against the sizes `scripts/build-web.sh` writes here, since a
    // compressed response's Content-Length says nothing about them.
    // iOS suspends a hidden page (the screen locked, another app) and drops its downloads:
    // a load that failed after the page was hidden starts again once it is shown.
    let hidden = document.hidden;
    document.addEventListener("visibilitychange", () => { hidden ||= document.hidden; });

    const loader = document.getElementById("loader");
    const bar = loader.querySelector("i");
    const sizes = { ui: Number("__UI_WASM_BYTES__") };
    const loaded = { ui: 0, kernel: 0 };
    const paint = () => {
      const total = Object.values(sizes).reduce((a, b) => a + b, 0);
      const ratio = Math.min(1, (loaded.ui + loaded.kernel) / total);
      bar.style.transform = `scaleX(${ratio})`;
      loader.setAttribute("aria-valuenow", Math.round(ratio * 100));
    };
    const counted = async (url, key) => {
      const response = await fetch(url);
      if (!response.ok || !response.body) return response;
      const body = response.body.pipeThrough(new TransformStream({
        transform(chunk, out) { loaded[key] += chunk.length; paint(); out.enqueue(chunk); },
      }));
      // The same headers: `application/wasm` keeps the streaming compile.
      return new Response(body, { status: response.status, statusText: response.statusText, headers: response.headers });
    };

    // The kernel's wasm is fetched now, for the worker to find it in the HTTP cache: the worker
    // only starts once the UI's wasm runs. Not without WebGPU, where the app only says so. A
    // failure here is not the page's: the worker reports its own.
    let kernel = Promise.resolve();
    if (navigator.gpu) {
      sizes.kernel = Number("__KERNEL_WASM_BYTES__");
      kernel = counted("./worker/skraft_kernel_worker_bg.wasm", "kernel")
        .then((response) => response.body?.pipeTo(new WritableStream()))
        .catch((err) => console.error("Skraft: kernel preload failed", err));
    }

    try {
      await init({ module_or_path: counted("./pkg/skraft_bg.wasm", "ui") });
      await kernel;
      await new Promise((frame) => requestAnimationFrame(() => requestAnimationFrame(frame)));
      loader.remove();
      window.skraftEdges();
    } catch (err) {
      console.error("Skraft failed to load", err);
      if (hidden) {
        const again = () => { if (!document.hidden) location.reload(); };
        document.addEventListener("visibilitychange", again);
        again();
      } else {
        loader.classList.add("failed");
        const why = document.createElement("p");
        why.textContent = String(err?.message ?? err);
        loader.append(why);
      }
    }
  </script>
</body>
</html>
