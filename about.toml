# cargo-about: the third-party notices the installers ship (scripts/third-party-licenses.sh).
# `accepted` mirrors deny.toml's `allow`, where a license is added once checked compatible
# with Skraft's GPL-3.0-or-later; it is the order of preference for a crate under a choice of
# licenses (`MIT OR Apache-2.0` → MIT's text).
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "BSL-1.0",
  "Unlicense",
  "0BSD",
  "Unicode-3.0",
  "MPL-2.0",
  "GPL-3.0-only",
]
# Only what the shipped app links (apps/skraft), for the platforms built.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
ignore-transitive-dependencies = false
private = { ignore = true }
