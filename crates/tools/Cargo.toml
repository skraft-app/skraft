[package]
name = "skraft-tools"
description = "Skraft: camera, display scene (mesh caches, picking), selection, editing context and the interactive tools — testable without a UI or a GPU"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
skraft-i18n.workspace = true
skraft-model.workspace = true
skraft-kernel.workspace = true
skraft-theme.workspace = true
glam.workspace = true
serde.workspace = true
# The journal's clock (src/editor/journal.rs), the web's too.
web-time = "1.1"

[dev-dependencies]
skraft-model = { workspace = true, features = ["engine"] }
skraft-kernel = { workspace = true, features = ["engine"] }
serde_json.workspace = true
# The rendering bench (src/bench.rs, `bench_render_step`): the renderer on a real model.
skraft-render.workspace = true
wgpu.workspace = true
pollster.workspace = true
