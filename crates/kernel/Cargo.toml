[package]
name = "skraft-kernel"
description = "Skraft: SolidCore behind a small, safe, record-based API (primitives, booleans, transforms, display meshes), run as jobs off the UI thread"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["engine"]
# The kernel itself (SolidCore). Without it: only the types (solids, meshes, jobs) and the
# record — what the web UI needs, the kernel running in its worker (docs/model/kernel.md).
engine = ["dep:solidcore", "dep:solidcore-convert", "dep:solidcore-tess", "dep:solidcore-ops", "dep:solidcore-step", "dep:skpwright"]

[dependencies]
skraft-i18n.workspace = true
solidcore = { workspace = true, optional = true }
solidcore-record.workspace = true
solidcore-convert = { workspace = true, optional = true }
solidcore-tess = { workspace = true, optional = true }
solidcore-ops = { workspace = true, optional = true }
solidcore-step = { workspace = true, optional = true }
skpwright = { workspace = true, optional = true }
glam.workspace = true
serde.workspace = true
rmp-serde.workspace = true

[dev-dependencies]
serde_json.workspace = true
