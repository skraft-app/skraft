[package]
name = "skraft-model"
description = "Skraft: the document (definitions, solids, instances), its operations, undo history and file format"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# `Document::apply` / `History::apply`, running the kernel in place (tests, tools).
engine = ["skraft-kernel/engine"]

[dependencies]
skraft-i18n.workspace = true
skraft-kernel.workspace = true
glam.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
skraft-kernel = { workspace = true, features = ["engine"] }
