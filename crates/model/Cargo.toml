[package]
name = "skraft-model"
description = "Skraft: the document (definitions, solids, occurrences), its operations, undo history and file format"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `Document::apply` / `History::apply`, running the kernel in place (tests, tools).
engine = ["skraft-kernel/engine"]

[dependencies]
skraft-i18n.workspace = true
skraft-kernel.workspace = true
glam.workspace = true
serde.workspace = true
serde_json.workspace = true
zip.workspace = true
flate2.workspace = true
blake3.workspace = true
base64.workspace = true
# The import's clock (src/import.rs), which also runs in the browser.
web-time = "1.1"

[dev-dependencies]
skraft-kernel = { workspace = true, features = ["engine"] }
