[workspace]
resolver = "3"
members = ["crates/i18n", "crates/theme", "crates/kernel", "crates/model", "crates/render", "crates/tools", "crates/control", "apps/skraft", "apps/kernel-worker", "apps/import", "apps/skraft-mcp"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
# Our crates are not published on crates.io (and so are not third-party in about.toml).
publish = false

[workspace.dependencies]
# Internal
skraft-i18n = { path = "crates/i18n" }
# Without its `engine` (SolidCore) unless a crate asks for it: the web UI does not (docs/model/kernel.md).
skraft-kernel = { path = "crates/kernel", default-features = false }
skraft-model = { path = "crates/model" }
skraft-render = { path = "crates/render" }
skraft-tools = { path = "crates/tools" }
skraft-control = { path = "crates/control" }
skraft-theme = { path = "crates/theme" }

# SolidCore (tangency-labs/solidcore, Apache-2.0): the B-rep kernel, its record (geometry as
# data) and its mesher. Only `solidcore` is on crates.io; the others come from the mirror,
# pinned to one revision so the crates always agree.
solidcore = { git = "https://github.com/tangency-labs/solidcore", rev = "793d09e8f1e1089fda739f228b20223068c9e14c" }
solidcore-record = { git = "https://github.com/tangency-labs/solidcore", rev = "793d09e8f1e1089fda739f228b20223068c9e14c" }
solidcore-convert = { git = "https://github.com/tangency-labs/solidcore", rev = "793d09e8f1e1089fda739f228b20223068c9e14c" }
solidcore-tess = { git = "https://github.com/tangency-labs/solidcore", rev = "793d09e8f1e1089fda739f228b20223068c9e14c" }
# SolidCore's operations layer (solidcore-step builds on it): the kernel's pcurves for the faces
# the STEP reader has no closed form for.
solidcore-ops = { git = "https://github.com/tangency-labs/solidcore", rev = "793d09e8f1e1089fda739f228b20223068c9e14c" }
# SolidCore's STEP crate, from the same revision: its topology reader builds the bodies of a
# STEP import and the planar-faced solids of a SketchUp import (crates/kernel, `step.rs`,
# `Solid::from_polyhedron`).
solidcore-step = { git = "https://github.com/tangency-labs/solidcore", rev = "793d09e8f1e1089fda739f228b20223068c9e14c" }

glam = { version = "0.30", features = ["serde"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
# Messages to and from the kernel's web worker (docs/model/kernel.md).
rmp-serde = "1"
# The `.skraft` container (docs/io/file-format.md): a ZIP, Deflate in Rust (miniz_oxide, wasm too).
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# The content hashes naming its entries (B-reps, textures).
blake3 = "1"
# A texture's image inline in the document's one JSON (`Document::to_json`).
base64 = "0.22"
# Decoding the textures' images for the viewport (PNG, JPEG; in Rust, the web too).
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
thiserror = "2"
# The texts of the app, from /locales (crates/i18n).
rust-i18n = "4"
log = "0.4"

egui = "0.37"
# `clipboard`: the system clipboard on the desktop (arboard), for text fields and the
# token of copy and paste (docs/tools/copy-paste.md).
eframe = { version = "0.37", default-features = false, features = ["wgpu", "persistence", "clipboard"] }
egui-wgpu = "0.37"
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
rfd = "0.17"
bytemuck = { version = "1", features = ["derive"] }
# The wgpu egui-wgpu 0.37 is built on.
wgpu = "30"
pollster = "0.4"

[profile.dev]
# Line numbers only (panic backtraces): full debug info made the build tree tens of GB.
debug = "line-tables-only"
# Unoptimised, the loops run every frame over every occurrence (tens of thousands) are many
# times slower: a light pass keeps a big model usable while developing.
opt-level = 1

[profile.dev.package."*"]
# The kernel is far too slow unoptimised.
opt-level = 2
# Nobody steps through wgpu or SolidCore: no debug info for dependencies.
debug = false

[profile.release]
opt-level = 3
lto = "thin"

[patch.crates-io]
# winit 0.30.13 with the app's cursors right on macOS (docs/ui/cursors.md): a custom cursor's
# bitmap taken at @2x (Retina) and premultiplied. Branch `skraft` of the fork, one commit.
winit = { git = "https://github.com/skraft-app/winit", rev = "0cb567f5a7bf32e062c8f020686eec86240a8f59" }
