[workspace]
resolver = "3"
members = ["crates/i18n", "crates/theme", "crates/kernel", "crates/model", "crates/render", "crates/tools", "apps/solidsketch", "apps/kernel-worker", "apps/import"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Internal
solidsketch-i18n = { path = "crates/i18n" }
# Without its `engine` (SolidCore) unless a crate asks for it: the web UI does not (§7 ter).
solidsketch-kernel = { path = "crates/kernel", default-features = false }
solidsketch-model = { path = "crates/model" }
solidsketch-render = { path = "crates/render" }
solidsketch-tools = { path = "crates/tools" }
solidsketch-theme = { path = "crates/theme" }

# SolidCore (tangency-labs/solidcore, Apache-2.0): the B-rep kernel, its record (geometry as
# data) and its mesher. Only `solidcore` is on crates.io; the others come from the mirror,
# pinned to one revision so the four crates always agree.
solidcore = { git = "https://github.com/tangency-labs/solidcore", rev = "e4f040d3fb9c9442af4d94b0fdfcad01e4c577d6" }
solidcore-record = { git = "https://github.com/tangency-labs/solidcore", rev = "e4f040d3fb9c9442af4d94b0fdfcad01e4c577d6" }
solidcore-convert = { git = "https://github.com/tangency-labs/solidcore", rev = "e4f040d3fb9c9442af4d94b0fdfcad01e4c577d6" }
solidcore-tess = { git = "https://github.com/tangency-labs/solidcore", rev = "e4f040d3fb9c9442af4d94b0fdfcad01e4c577d6" }
# SolidCore's STEP reader and B-rep builder, from the same revision: its neutral body model
# builds the planar-faced solids of an import (crates/kernel, `Solid::from_polyhedron`).
step-import = { git = "https://github.com/tangency-labs/solidcore", rev = "e4f040d3fb9c9442af4d94b0fdfcad01e4c577d6" }
step-brep = { git = "https://github.com/tangency-labs/solidcore", rev = "e4f040d3fb9c9442af4d94b0fdfcad01e4c577d6" }

glam = { version = "0.30", features = ["serde"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
# Messages to and from the kernel's web worker (ARCHITECTURE.md §7 ter).
rmp-serde = "1"
thiserror = "2"
# The texts of the app, from /locales (crates/i18n).
rust-i18n = "4"
log = "0.4"

egui = "0.37"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "persistence"] }
egui-wgpu = "0.37"
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
rfd = "0.17"
bytemuck = { version = "1", features = ["derive"] }
# The wgpu egui-wgpu 0.37 is built on.
wgpu = "30"
pollster = "0.4"

[profile.dev]
# Line numbers only (panic backtraces): full debug info made the build tree tens of GB.
debug = "line-tables-only"
# Unoptimised, the loops run every frame over every occurrence (tens of thousands) are many
# times slower: a light pass keeps a big model usable while developing.
opt-level = 1

[profile.dev.package."*"]
# The kernel is far too slow unoptimised.
opt-level = 2
# Nobody steps through wgpu or SolidCore: no debug info for dependencies.
debug = false

[profile.release]
opt-level = 3
lto = "thin"
